<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050914" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Offline — FindIt</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/findit-icon-192.png" />
    <link rel="stylesheet" href="/offline.css" />
  </head>
  <body>
    <main role="main">
      <img
        class="mark"
        src="/brand/findit-icon-192.png"
        alt=""
        width="72"
        height="72"
        decoding="async"
      />

      <h1>You're offline</h1>
      <p>
        FindIt can't reach the network right now. Anything you've already opened
        stays available, and we'll reconnect automatically as soon as your
        connection returns.
      </p>

      <div class="actions">
        <button type="button" id="retry" class="primary">Try again</button>
        <a class="button" href="/">Go to home</a>
      </div>

      <!-- Announced to screen readers when connectivity changes, without
           stealing focus from whatever the user is doing. -->
      <p class="status" id="status" role="status" aria-live="polite">
        Waiting for a connection…
      </p>
    </main>

    <!-- External file, not inline: the app CSP sets `script-src 'self'`. -->
    <script src="/offline.js"></script>
  </body>
</html>
