name: Bootstrap production worker environment

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  copy-production-worker-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-production
    steps:
      - name: Copy production worker variables and secrets
        env:
          GH_TOKEN: ${{ github.token }}
          FINDIT_EMAIL_DISPATCH_TOKEN: ${{ secrets.FINDIT_EMAIL_DISPATCH_TOKEN }}
          FINDIT_LISTING_EXPIRY_WORKER_SECRET: ${{ secrets.FINDIT_LISTING_EXPIRY_WORKER_SECRET }}
          FINDIT_MEDIA_CLEANUP_WORKER_SECRET: ${{ secrets.FINDIT_MEDIA_CLEANUP_WORKER_SECRET }}
          FINDIT_NOTIFICATION_FANOUT_WORKER_SECRET: ${{ secrets.FINDIT_NOTIFICATION_FANOUT_WORKER_SECRET }}
          FINDIT_PUSH_DISPATCH_TOKEN: ${{ secrets.FINDIT_PUSH_DISPATCH_TOKEN }}
          FINDIT_RECOMMENDATION_WORKER_SECRET: ${{ secrets.FINDIT_RECOMMENDATION_WORKER_SECRET }}
          FINDIT_SUPABASE_ANON_KEY: ${{ secrets.FINDIT_SUPABASE_ANON_KEY }}
          FINDIT_SUPABASE_SECRET_KEY: ${{ secrets.FINDIT_SUPABASE_SECRET_KEY }}
          FINDIT_TOUR_CACHE_WORKER_SECRET: ${{ secrets.FINDIT_TOUR_CACHE_WORKER_SECRET }}
          FINDIT_TOUR_CLEANUP_WORKER_SECRET: ${{ secrets.FINDIT_TOUR_CLEANUP_WORKER_SECRET }}
          FINDIT_TOUR_OBSERVABILITY_WORKER_SECRET: ${{ secrets.FINDIT_TOUR_OBSERVABILITY_WORKER_SECRET }}
          FINDIT_ESSENTIAL_NOTIFICATIONS_WORKERS_ENABLED: ${{ vars.FINDIT_ESSENTIAL_NOTIFICATIONS_WORKERS_ENABLED }}
          FINDIT_EXPECTED_PROJECT_REF: ${{ vars.FINDIT_EXPECTED_PROJECT_REF }}
          FINDIT_RECOMMENDATION_WORKERS_ENABLED: ${{ vars.FINDIT_RECOMMENDATION_WORKERS_ENABLED }}
          FINDIT_SUPABASE_URL: ${{ vars.FINDIT_SUPABASE_URL }}
          FINDIT_TRANSACTIONAL_EMAIL_WORKERS_ENABLED: ${{ vars.FINDIT_TRANSACTIONAL_EMAIL_WORKERS_ENABLED }}
          FINDIT_TOURS_WORKERS_ENABLED: ${{ vars.FINDIT_TOURS_WORKERS_ENABLED }}
          FINDIT_WEB_PUSH_WORKERS_ENABLED: ${{ vars.FINDIT_WEB_PUSH_WORKERS_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail

          set_secret() {
            local name="$1"
            local value="$2"
            test -n "$value"
            printf '%s' "$value" | gh secret set "$name" --repo mmugambiwa14-netizen/findit-marketplace --env cloudflare-production-workers --body - >/dev/null
          }

          set_variable() {
            local name="$1"
            local value="$2"
            test -n "$value"
            gh variable set "$name" --repo mmugambiwa14-netizen/findit-marketplace --env cloudflare-production-workers --body "$value" >/dev/null
          }

          set_secret FINDIT_EMAIL_DISPATCH_TOKEN "$FINDIT_EMAIL_DISPATCH_TOKEN"
          set_secret FINDIT_LISTING_EXPIRY_WORKER_SECRET "$FINDIT_LISTING_EXPIRY_WORKER_SECRET"
          set_secret FINDIT_MEDIA_CLEANUP_WORKER_SECRET "$FINDIT_MEDIA_CLEANUP_WORKER_SECRET"
          set_secret FINDIT_NOTIFICATION_FANOUT_WORKER_SECRET "$FINDIT_NOTIFICATION_FANOUT_WORKER_SECRET"
          set_secret FINDIT_PUSH_DISPATCH_TOKEN "$FINDIT_PUSH_DISPATCH_TOKEN"
          set_secret FINDIT_RECOMMENDATION_WORKER_SECRET "$FINDIT_RECOMMENDATION_WORKER_SECRET"
          set_secret FINDIT_SUPABASE_ANON_KEY "$FINDIT_SUPABASE_ANON_KEY"
          set_secret FINDIT_SUPABASE_SECRET_KEY "$FINDIT_SUPABASE_SECRET_KEY"
          set_secret FINDIT_TOUR_CACHE_WORKER_SECRET "$FINDIT_TOUR_CACHE_WORKER_SECRET"
          set_secret FINDIT_TOUR_CLEANUP_WORKER_SECRET "$FINDIT_TOUR_CLEANUP_WORKER_SECRET"
          set_secret FINDIT_TOUR_OBSERVABILITY_WORKER_SECRET "$FINDIT_TOUR_OBSERVABILITY_WORKER_SECRET"

          set_variable FINDIT_ESSENTIAL_NOTIFICATIONS_WORKERS_ENABLED "$FINDIT_ESSENTIAL_NOTIFICATIONS_WORKERS_ENABLED"
          set_variable FINDIT_EXPECTED_PROJECT_REF "$FINDIT_EXPECTED_PROJECT_REF"
          set_variable FINDIT_RECOMMENDATION_WORKERS_ENABLED "$FINDIT_RECOMMENDATION_WORKERS_ENABLED"
          set_variable FINDIT_SUPABASE_URL "$FINDIT_SUPABASE_URL"
          set_variable FINDIT_TRANSACTIONAL_EMAIL_WORKERS_ENABLED "$FINDIT_TRANSACTIONAL_EMAIL_WORKERS_ENABLED"
          set_variable FINDIT_TOURS_WORKERS_ENABLED "$FINDIT_TOURS_WORKERS_ENABLED"
          set_variable FINDIT_WEB_PUSH_WORKERS_ENABLED "$FINDIT_WEB_PUSH_WORKERS_ENABLED"
