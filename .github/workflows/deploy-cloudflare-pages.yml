name: Deploy to Cloudflare Pages

# Cloudflare is the authoritative hosting platform. This workflow is the only
# deployment path: GitHub -> certification -> Cloudflare.
#
# Environment separation note. This workflow BUILDS the bundle in CI and then
# uploads dist/ to Cloudflare. The Supabase URL and key are Vite build-time
# values, so they are baked in here, not read from Cloudflare Pages project
# settings. That means the separation must happen in GitHub: the job selects a
# GitHub Environment by branch, and each environment supplies its own variables.
# A pull request therefore cannot build against production Supabase.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.repository == 'mmugambiwa14-netizen/findit-marketplace' }}
    # main -> production variables; everything else -> preview variables.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Normalize locked dependency metadata
        run: node ./scripts/normalize-package-lock.mjs --write

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        id: install
        run: npm ci --ignore-scripts

      # Certification runs before anything is published. A build that cannot
      # pass these must not reach an origin, preview or otherwise.
      - name: Lint application
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck active release surface
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck:active

      - name: Run all contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:contracts

      - name: Verify Cloudflare edge configuration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test tests/cloudflareHeadersContracts.test.mjs

      # Fail closed on missing configuration. Without this the build would
      # succeed and ship a bundle that throws at startup in the browser.
      - name: Require environment configuration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "VITE_SUPABASE_URL is not set for this environment"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "VITE_SUPABASE_ANON_KEY is not set for this environment"; exit 1; }
          case "$SUPABASE_ANON_KEY" in
            sb_publishable_*|eyJ*) ;;
            *) echo "VITE_SUPABASE_ANON_KEY does not look like a publishable/anon key"; exit 1 ;;
          esac
          # A service-role key must never reach a VITE_ variable; it would ship
          # to every browser. Refuse the build rather than leak it.
          case "$SUPABASE_ANON_KEY" in
            sb_secret_*|*service_role*) echo "refusing: a secret key was supplied as the browser key"; exit 1 ;;
          esac

      - name: Build production application
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # public/_headers and public/_redirects are copied into dist/ by Vite and
      # carry the security posture (CSP, HSTS, COOP/CORP, frame denial) plus the
      # SPA fallback. Fail loudly rather than serving a build without them.
      - name: Confirm edge configuration reached the build output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          test -f dist/_headers || { echo "dist/_headers missing"; exit 1; }
          test -f dist/_redirects || { echo "dist/_redirects missing"; exit 1; }
          grep -q "Content-Security-Policy" dist/_headers || { echo "CSP missing from dist/_headers"; exit 1; }

      # wrangler is invoked directly rather than through a third-party action,
      # matching how cloudflare-provisioning-gates.yml already calls it. That
      # keeps the supply chain to actions this repository has already pinned.
      - name: Publish to Cloudflare Pages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          npx --yes wrangler@4 pages deploy dist \
            --project-name=peekalisting \
            --branch="$DEPLOY_BRANCH"
