name: Release candidate gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      VITE_SUPABASE_URL: https://findit-release-validation.supabase.co
      VITE_SUPABASE_ANON_KEY: release-validation-key
      VITE_FEATURE_BUSINESS_PROFILES: "true"
      VITE_FEATURE_MESSAGING: "true"
      VITE_FEATURE_ESSENTIAL_NOTIFICATIONS: "true"
      VITE_AUTH_GOOGLE_ENABLED: "true"
      VITE_FEATURE_GOOGLE_OAUTH: "true"
      VITE_FEATURE_INTERNATIONAL_LISTING: "true"
      VITE_FEATURE_MANUAL_LOCATION: "true"
      VITE_FEATURE_CURRENT_LOCATION: "true"
      VITE_FEATURE_REPORTING: "true"
      VITE_FEATURE_PAYMENTS: "false"
      VITE_FEATURE_SUBSCRIPTIONS: "false"
      VITE_FEATURE_ESCROW: "false"
      VITE_FEATURE_PREMIUM_LISTINGS: "false"
      VITE_FEATURE_AI_MODERATION: "false"
      VITE_FEATURE_AI_BAN_EVASION: "false"
      VITE_FEATURE_AI_TICKET_TRIAGE: "false"
      VITE_FEATURE_AI_SUPPORT_CHAT: "false"
      VITE_FEATURE_SCHEDULED_REMINDERS: "false"
      VITE_FEATURE_MARKETING_EMAILS: "false"
      VITE_FEATURE_LISTING_EXPIRY: "false"
      VITE_FEATURE_LISTING_FRESHNESS_REMINDERS: "false"
      VITE_FEATURE_TOURS: "true"
      VITE_FEATURE_TOURS_PREVIEW: "false"
      VITE_FEATURE_PREVIEW_FIXTURES: "false"
      VITE_PREVIEW_AUTH_BYPASS: "false"
      TOURS_BACKEND_ENABLED: "true"
      FINDIT_TOURS_WORKERS_ENABLED: "true"
      FINDIT_TOUR_PROCESSOR_MODE: "github-actions"
      FINDIT_TOUR_CLEANUP_WORKER_SECRET: release-validation-cleanup-secret
      FINDIT_TOUR_CACHE_WORKER_SECRET: release-validation-cache-secret
      FINDIT_TOUR_OBSERVABILITY_WORKER_SECRET: release-validation-observability-secret
      FINDIT_TOURS_RELEASE_ACCEPTED: "true"
      FINDIT_TOURS_ACCEPTANCE_ID: "tour-acceptance-ci-build-validation-0001"
      FINDIT_ESSENTIAL_NOTIFICATIONS_WORKERS_ENABLED: "true"
      FINDIT_NOTIFICATION_FANOUT_WORKER_SECRET: release-validation-fanout-secret
      FINDIT_RECOMMENDATION_WORKERS_ENABLED: "true"
      FINDIT_RECOMMENDATION_WORKER_SECRET: release-validation-recommendation-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Use Deno for Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install locked dependencies
        run: npm ci --include=dev --ignore-scripts

      - name: Validate release environment
        run: npm run validate:env

      - name: Verify source graph
        run: npm run verify:source-graph

      - name: Verify repository hygiene
        run: npm run verify:hygiene

      - name: Verify SQL migration boundary
        run: npm run verify:sql-boundary

      - name: Audit routed product surface
        run: npm run audit:product-surface

      - name: Run complete contracts
        run: npm run test:contracts

      - name: Run Tours contracts
        run: npm run test:tours-contracts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck:migration
          npm run typecheck:active
          npm run typecheck:edge-functions

      - name: Build production application
        run: npm run build

      - name: Audit production dependencies
        run: npm run audit:production
