name: GitHub Pages Preview

on:
  push:
    branches:
      - claude/peekalisting-audit-ui0z6l
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/claude/peekalisting-audit-ui0z6l'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      VITE_MODE: staging
      VITE_BASE_PATH: /findit-marketplace/
      VITE_SUPABASE_URL: ${{ vars.FINDIT_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.FINDIT_SUPABASE_ANON_KEY }}
      VITE_AUTH_GOOGLE_ENABLED: ${{ vars.FINDIT_AUTH_GOOGLE_ENABLED }}
      VITE_AUTH_APPLE_ENABLED: "false"
      VITE_FEATURE_BUSINESS_PROFILES: "true"
      VITE_FEATURE_CURATED_BUSINESS_MARKETPLACE: "true"
      VITE_FEATURE_MESSAGING: "true"
      VITE_FEATURE_ESSENTIAL_NOTIFICATIONS: "true"
      VITE_FEATURE_GOOGLE_OAUTH: "true"
      VITE_FEATURE_MAPS: ${{ vars.FINDIT_MAPS_ENABLED }}
      VITE_MAPTILER_PUBLIC_KEY: ${{ secrets.FINDIT_MAPTILER_PUBLIC_KEY }}
      VITE_MAPTILER_STYLE_ID: ${{ vars.FINDIT_MAPTILER_STYLE_ID }}
      VITE_FEATURE_INTERNATIONAL_LISTING: "false"
      VITE_FEATURE_MANUAL_LOCATION: "true"
      VITE_FEATURE_CURRENT_LOCATION: "true"
      VITE_FEATURE_CURRENCY_CONVERSION: "false"
      VITE_FEATURE_PHONE_VERIFICATION: "false"
      VITE_FEATURE_SERVICE_RADIUS: "false"
      VITE_FEATURE_REPORTING: "true"
      VITE_FEATURE_PAYMENTS: "false"
      VITE_FEATURE_SUBSCRIPTIONS: "false"
      VITE_FEATURE_ESCROW: "false"
      VITE_FEATURE_PREMIUM_LISTINGS: "false"
      VITE_FEATURE_AI_MODERATION: "false"
      VITE_FEATURE_AI_BAN_EVASION: "false"
      VITE_FEATURE_AI_TICKET_TRIAGE: "false"
      VITE_FEATURE_AI_SUPPORT_CHAT: "false"
      VITE_FEATURE_SCHEDULED_REMINDERS: "false"
      VITE_FEATURE_MARKETING_EMAILS: "false"
      VITE_FEATURE_LISTING_EXPIRY: "false"
      VITE_FEATURE_LISTING_FRESHNESS_REMINDERS: "false"
      VITE_FEATURE_PREVIEW_FIXTURES: "true"
      VITE_PREVIEW_AUTH_BYPASS: "false"
      VITE_FEATURE_TOURS: "true"
      VITE_FEATURE_TOURS_PREVIEW: "true"
    steps:
      - name: Checkout exact preview head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Verify preview source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "claude/peekalisting-audit-ui0z6l"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Deploying PeekaListing preview from $GITHUB_REF_NAME@$GITHUB_SHA"

      - name: Normalize lockfile
        run: node ./scripts/normalize-package-lock.mjs --write

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --include=dev --ignore-scripts

      - name: Validate environment
        run: npm run validate:env

      - name: Build
        run: npm run build

      - name: Add SPA fallback
        run: node ./scripts/create-pages-spa-fallback.mjs dist "$VITE_BASE_PATH"

      - name: Stamp preview head
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/preview-build.json <<EOF
          {"product":"PeekaListing","branch":"$GITHUB_REF_NAME","sha":"$GITHUB_SHA","run_id":"$GITHUB_RUN_ID"}
          EOF
          printf '\n<!-- product:PeekaListing preview-branch:%s preview-sha:%s -->\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" >> dist/index.html
          if [ -f dist/404.html ]; then
            printf '\n<!-- product:PeekaListing preview-branch:%s preview-sha:%s -->\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" >> dist/404.html
          fi
          if [ -f dist/sw.js ]; then
            printf '\n// product:PeekaListing preview-build-sha:%s\n' "$GITHUB_SHA" >> dist/sw.js
          fi

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
