name: Temporary Regenerate Lockfile

on:
  push:
    branches:
      - maintenance/regenerate-lock-metadata
    paths:
      - .github/workflows/temporary-regenerate-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: maintenance/regenerate-lock-metadata
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package-lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify production dependency boundary
        run: npm run audit:production

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "PeekaListing Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: regenerate package lock dependency flags"
          git push origin HEAD:maintenance/regenerate-lock-metadata
