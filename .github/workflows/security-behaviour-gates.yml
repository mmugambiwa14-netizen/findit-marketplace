name: Security Behaviour Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/services/**'
      - 'src/components/ProtectedRoute.jsx'
      - 'src/components/auth/**'
      - 'tests/security/**'
      - '.github/workflows/security-behaviour-gates.yml'
  push:
    branches: [main]
    paths:
      - 'src/services/**'
      - 'src/components/ProtectedRoute.jsx'
      - 'src/components/auth/**'
      - 'tests/security/**'

permissions:
  contents: read

concurrency:
  group: security-behaviour-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-behaviour:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Run security behavior contracts
        run: node --test ./tests/security/*.test.mjs
