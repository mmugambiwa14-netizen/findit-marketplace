name: Security Behaviour Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/services/**'
      - 'src/components/ProtectedRoute.jsx'
      - 'src/components/auth/**'
      - 'tests/security/**'
      - '.github/workflows/security-behaviour-gates.yml'
  push:
    branches: [main]
    paths:
      - 'src/services/**'
      - 'src/components/ProtectedRoute.jsx'
      - 'src/components/auth/**'
      - 'tests/security/**'

permissions:
  contents: read

concurrency:
  group: security-behaviour-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-behaviour:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '23.6.0'
      - name: Run security behavior contracts
        run: node --test ./tests/security/*.test.mjs
