name: Recommendation database gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/rollback/**"
      - "supabase/tests/v1_recommendation_*.sql"
      - "supabase/tests/v1_contextual_ecosystem_intelligence.sql"
      - "supabase/tests/v1_private_authenticated_rpc_implementations.sql"
      - "supabase/tests/v1_security_advisor_baseline.sql"
      - "scripts/run-recommendation-database-certification.sh"
      - "scripts/verify-sql-boundary.mjs"
      - ".github/workflows/recommendation-database-gates.yml"

permissions:
  contents: read

concurrency:
  group: recommendation-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Reset, lint and recommendation pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Normalize locked dependency metadata
        run: node ./scripts/normalize-package-lock.mjs --write

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify migration sequence and rollback pairs
        run: npm run verify:sql-boundary

      - name: Run recommendation clean-database certification
        run: bash ./scripts/run-recommendation-database-certification.sh
