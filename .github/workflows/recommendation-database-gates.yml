name: Recommendation database gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/rollback/**"
      - "supabase/tests/v1_recommendation_*.sql"
      - "scripts/verify-sql-boundary.mjs"
      - ".github/workflows/recommendation-database-gates.yml"

permissions:
  contents: read

concurrency:
  group: recommendation-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Reset, lint and recommendation pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify migration sequence and rollback pairs
        run: npm run verify:sql-boundary

      - name: Start clean local database and apply every migration
        run: npx --yes supabase@2.84.2 db start

      - name: Lint database schema
        run: npx --yes supabase@2.84.2 db lint --local --level error

      - name: Run complete recommendation database certification
        run: |
          npx --yes supabase@2.84.2 test db supabase/tests/v1_recommendation_foundation.sql --local
          npx --yes supabase@2.84.2 test db supabase/tests/v1_recommendation_projection_queue.sql --local
          npx --yes supabase@2.84.2 test db supabase/tests/v1_recommendation_scale.sql --local

      - name: Stop local database
        if: always()
        run: npx --yes supabase@2.84.2 stop --no-backup
