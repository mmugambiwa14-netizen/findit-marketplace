name: Critical Infrastructure Gates

on:
  pull_request:
    branches:
      - main
    paths:
      - 'workers/**'
      - 'infrastructure/cloudflare/**'
      - 'supabase/functions/verify-turnstile/**'
      - 'src/lib/traceContext.js'
      - 'tests/criticalHighInfrastructureContracts.test.mjs'
      - '.github/workflows/critical-infrastructure-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-infrastructure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Normalize lockfile
        run: node ./scripts/normalize-package-lock.mjs --write
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: node --test tests/criticalHighInfrastructureContracts.test.mjs
      - run: npm run typecheck:edge-functions

  media-worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build media worker image
        run: docker build --file workers/media/Dockerfile --tag peekalisting-media-worker:ci .
      - name: Verify FFmpeg toolchain
        run: docker run --rm --entrypoint ffmpeg peekalisting-media-worker:ci -version
      - name: Verify non-root runtime
        run: test "$(docker inspect --format='{{.Config.User}}' peekalisting-media-worker:ci)" = "node"
