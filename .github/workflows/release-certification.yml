name: Release Certification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/listing-intelligence-foundation
  push:
    branches:
      - main
      - feature/listing-intelligence-foundation

permissions:
  contents: read

concurrency:
  group: release-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Repository release gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      # Use the repository-approved immutable Deno setup action so Edge Function
      # typechecking never falls back to an unpinned network install through npx.
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate repository and production boundaries
        run: |
          npm run audit:production
          npm run verify:hygiene
          npm run verify:source-graph
          npm run verify:sql-boundary
          npm run verify:base44-elimination

      # The repository is migrating legacy JavaScript incrementally. The active
      # production graph is the enforced release boundary; the broad migration
      # typecheck remains a separate backlog gate and must not block staging for
      # inactive files outside that graph.
      - name: Run active static and contract gates
        run: |
          npm run lint
          npm run typecheck:active
          npm run typecheck:edge-functions
          npm run test:contracts
          npm run test:tours-contracts
          npm run test:product-audit

      - name: Build production bundle
        run: npm run build

      - name: Generate release-candidate evidence
        run: npm run certify:release-candidate

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-certification-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/**
            dist/**
            FINDIT_EXTENSIVE_PRODUCT_AUDIT_2026-07-27.md
            PROJECT_STATUS.md
            PRODUCTION_READINESS_REPORT.md
