name: Seed staging catalogue media

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SEED-STAGING to confirm a safe, idempotent staging reseed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: findit-staging-catalogue-seed
  cancel-in-progress: false

jobs:
  seed:
    if: inputs.confirmation == 'SEED-STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging-tours
    env:
      FINDIT_SUPABASE_URL: ${{ vars.FINDIT_SUPABASE_URL }}
      FINDIT_SUPABASE_ANON_KEY: ${{ secrets.FINDIT_SUPABASE_ANON_KEY }}
      FINDIT_SUPABASE_SECRET_KEY: ${{ secrets.FINDIT_SUPABASE_SECRET_KEY }}
      FFMPEG_PATH: /usr/bin/ffmpeg

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Normalize locked dependency metadata
        run: node ./scripts/normalize-package-lock.mjs --write

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev --ignore-scripts

      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Verify taxonomy and seed Zimbabwe catalogue
        run: node scripts/seed-staging-catalogue.mjs seed
