name: Diagnose 0087 helper fingerprints

on:
  pull_request:
  push:
    branches:
      - feature/listing-intelligence-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Hold migration 0087 outside the migration directory
        run: mv supabase/migrations/0087_private_policy_helper_boundary.sql /tmp/0087_private_policy_helper_boundary.sql

      - name: Start clean database through migration 0086
        run: npx --yes supabase@2.84.2 start

      - name: Print clean policy-helper fingerprints
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 55322 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          select
            p.proname,
            pg_get_function_identity_arguments(p.oid) as identity_arguments,
            pg_get_function_result(p.oid) as result_type,
            p.provolatile,
            md5(p.prosrc) as body_md5,
            p.proconfig::text as config_text,
            coalesce(p.proacl::text, '') as acl_text,
            pg_get_userbyid(p.proowner) as owner_name
          from pg_proc p
          join pg_namespace n on n.oid = p.pronamespace
          where n.nspname = 'public'
            and p.proname in (
              'can_read_listing_context',
              'has_active_tour_upload_intent',
              'has_valid_listing_upload_intent',
              'has_valid_marketplace_image_upload_intent',
              'is_attached_marketplace_image',
              'is_public_marketplace_image'
            )
          order by p.proname, identity_arguments;
          SQL

      - name: Stop local database
        if: always()
        run: npx --yes supabase@2.84.2 stop --no-backup
