name: Buyer Journey Certification

on:
  workflow_dispatch:
    inputs:
      target:
        description: Certification target
        required: true
        default: staging
        type: choice
        options:
          - local
          - staging
  pull_request:
    paths:
      - 'scripts/certify-buyer-journey.mjs'
      - 'tests/buyerJourneyCertificationContracts.test.mjs'
      - '.github/workflows/buyer-journey-certification.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - run: node --test tests/buyerJourneyCertificationContracts.test.mjs

  certify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'staging' && 'staging' || '' }}
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - run: npm ci
      - name: Start local Supabase
        if: inputs.target == 'local'
        run: npx --yes supabase@2.84.2 start
      - name: Run buyer certification
        run: node scripts/certify-buyer-journey.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buyer-journey-certification
          path: artifacts/certification/buyer-journey.json
          if-no-files-found: error
