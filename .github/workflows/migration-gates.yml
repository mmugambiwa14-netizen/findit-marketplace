name: Migration gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: migration-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci_local_only_0000000000000000
      VITE_FEATURE_BUSINESS_PROFILES: "true"
      VITE_FEATURE_MESSAGING: "false"
      VITE_FEATURE_ESSENTIAL_NOTIFICATIONS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Use Deno for Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Validate browser environment
        run: npm run validate:env

      - name: Verify SQL migration boundary
        run: npm run verify:sql-boundary

      - name: Lint
        run: npm run lint

      - name: Typecheck migrated boundaries
        run: npm run typecheck:migration

      - name: Typecheck active V1 graph
        run: npm run typecheck:active

      - name: Typecheck Supabase Edge Functions
        run: npm run typecheck:edge-functions

      - name: Run source contracts
        run: npm run test:contracts

      - name: Verify Base44 elimination
        run: npm run verify:base44-elimination

      - name: Build and scan generated output
        env:
          NODE_ENV: production
        run: npm run build

  database:
    name: Database reset, RLS and recommendation certification
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Start a clean Supabase stack and apply all migrations
        run: npx --yes supabase@2.84.2 start

      - name: Lint database schema
        run: npx --yes supabase@2.84.2 db lint --local --level error

      - name: Run public business-profile view security matrix
        run: npx --yes supabase@2.84.2 test db supabase/tests/v1_public_business_profile_view_security.sql --local

      - name: Run extension schema security matrix
        run: npx --yes supabase@2.84.2 test db supabase/tests/v1_extension_schema_security.sql --local

      - name: Run foreign key index coverage matrix
        run: npx --yes supabase@2.84.2 test db supabase/tests/v1_foreign_key_index_coverage.sql --local

      - name: Run recommendation RLS and lifecycle matrix
        run: npx --yes supabase@2.84.2 test db supabase/tests/v1_recommendation_foundation.sql --local

      - name: Run fail-open projection queue matrix
        run: npx --yes supabase@2.84.2 test db supabase/tests/v1_recommendation_projection_queue.sql --local

      - name: Run eligibility, geography and deletion matrix
        run: npx --yes supabase@2.84.2 test db supabase/tests/v1_recommendation_eligibility_geospatial.sql --local

      - name: Run publication boundary matrix
        run: npx --yes supabase@2.84.2 test db supabase/tests/v1_recommendation_publication_boundary.sql --local

      - name: Run independent recommendation service matrix
        run: npx --yes supabase@2.84.2 test db supabase/tests/v1_recommendation_services.sql --local

      - name: Run service operations and audit matrix
        run: npx --yes supabase@2.84.2 test db supabase/tests/v1_recommendation_service_operations.sql --local

      - name: Run recommendation query-plan and cursor scale suite
        run: npx --yes supabase@2.84.2 test db supabase/tests/v1_recommendation_scale.sql --local

      - name: Run contextual ecosystem intelligence matrix
        run: npx --yes supabase@2.84.2 test db supabase/tests/v1_contextual_ecosystem_intelligence.sql --local

      - name: Run recommendation personalization privacy matrix
        run: npx --yes supabase@2.84.2 test db supabase/tests/v1_recommendation_personalization.sql --local

      - name: Run aggregate recommendation analytics matrix
        run: npx --yes supabase@2.84.2 test db supabase/tests/v1_recommendation_analytics.sql --local

      - name: Run executable related-services matrix
        run: npx --yes supabase@2.84.2 test db supabase/tests/v1_recommendation_related_services.sql --local

      - name: Stop local Supabase stack
        if: always()
        run: npx --yes supabase@2.84.2 stop --no-backup
