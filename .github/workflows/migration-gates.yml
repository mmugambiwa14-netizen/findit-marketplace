name: Migration gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci_local_only_0000000000000000
      VITE_FEATURE_BUSINESS_PROFILES: "true"
      VITE_FEATURE_MESSAGING: "false"
      VITE_FEATURE_ESSENTIAL_NOTIFICATIONS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Validate browser environment
        run: npm run validate:env

      - name: Verify SQL migration boundary
        run: npm run verify:sql-boundary

      - name: Lint
        run: npm run lint

      - name: Typecheck migrated boundaries
        run: npm run typecheck:migration

      - name: Typecheck active V1 graph
        run: npm run typecheck:active

      - name: Run source contracts
        run: npm run test:contracts

      - name: Verify Base44 elimination
        run: npm run verify:base44-elimination

      - name: Build and scan generated output
        run: npm run build

  database:
    name: Database reset, lint and recommendation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Start clean local database and apply every migration
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint --local --level error

      - name: Run recommendation RLS and lifecycle matrix
        run: supabase test db supabase/tests/v1_recommendation_foundation.sql --local

      - name: Run recommendation query-plan and cursor scale suite
        run: supabase test db supabase/tests/v1_recommendation_scale.sql --local

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
