name: Migration gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: migration-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci_local_only_0000000000000000
      VITE_FEATURE_BUSINESS_PROFILES: "true"
      VITE_FEATURE_MESSAGING: "false"
      VITE_FEATURE_ESSENTIAL_NOTIFICATIONS: "false"
      VITE_FEATURE_MAPS: "false"
      VITE_FEATURE_CURRENT_LOCATION: "false"
      VITE_FEATURE_INTERNATIONAL_LISTING: "false"
      VITE_FEATURE_CURRENCY_CONVERSION: "false"
      VITE_FEATURE_PHONE_VERIFICATION: "false"
      VITE_FEATURE_SERVICE_RADIUS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Normalize locked dependency metadata
        run: node ./scripts/normalize-package-lock.mjs --write

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      # denoland/setup-deno@v2 is pinned below to an immutable commit.
      - name: Use Deno for Edge Function checks
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Validate browser environment
        run: npm run validate:env

      - name: Verify deployment security boundary
        run: npm run verify:deployment-security

      - name: Verify SQL migration boundary
        run: npm run verify:sql-boundary

      - name: Verify immutable workflow actions
        run: node ./scripts/verify-workflow-pinning.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck migrated boundaries
        run: npm run typecheck:migration

      - name: Typecheck active V1 graph
        run: npm run typecheck:active

      - name: Typecheck Supabase Edge Functions
        run: npm run typecheck:edge-functions

      - name: Run source contracts
        run: npm run test:contracts

      - name: Verify Base44 elimination
        run: npm run verify:base44-elimination

      - name: Build and scan generated output
        env:
          NODE_ENV: production
        run: npm run build

  database:
    name: Database reset, RLS and recommendation certification
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Run clean-database certification matrix
        run: bash ./scripts/run-migration-database-certification.sh
