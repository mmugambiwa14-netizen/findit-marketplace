name: Web Push delivery

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: web-push-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-production-workers
    steps:
      - name: Validate required configuration
        env:
          SUPABASE_URL: ${{ vars.FINDIT_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.FINDIT_SUPABASE_ANON_KEY }}
          PUSH_DISPATCH_TOKEN: ${{ secrets.FINDIT_PUSH_DISPATCH_TOKEN }}
          FINDIT_WEB_PUSH_WORKERS_ENABLED: ${{ vars.FINDIT_WEB_PUSH_WORKERS_ENABLED }}
        run: |
          if [[ "${FINDIT_WEB_PUSH_WORKERS_ENABLED:-false}" != "true" ]]; then
            echo 'Web Push delivery is disabled for this environment.'
            exit 0
          fi
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$PUSH_DISPATCH_TOKEN"

      - name: Deliver pending push notifications
        env:
          SUPABASE_URL: ${{ vars.FINDIT_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.FINDIT_SUPABASE_ANON_KEY }}
          PUSH_DISPATCH_TOKEN: ${{ secrets.FINDIT_PUSH_DISPATCH_TOKEN }}
          FINDIT_WEB_PUSH_WORKERS_ENABLED: ${{ vars.FINDIT_WEB_PUSH_WORKERS_ENABLED }}
        run: |
          if [[ "${FINDIT_WEB_PUSH_WORKERS_ENABLED:-false}" != "true" ]]; then
            echo 'Web Push delivery is disabled for this environment.'
            exit 0
          fi
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --max-time 45 \
            -X POST "$SUPABASE_URL/functions/v1/web-push-dispatch" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "x-push-dispatch-token: $PUSH_DISPATCH_TOKEN" \
            -H "content-type: application/json" \
            --data '{"limit":50}'
