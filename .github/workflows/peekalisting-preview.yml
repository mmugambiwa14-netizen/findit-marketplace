name: Deploy canonical PeekaListing staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peekalisting-canonical-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-staging
      url: https://staging.peekalisting.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: peekalisting-staging
      CLOUDFLARE_STAGING_DOMAIN: staging.peekalisting.com
      CLOUDFLARE_ZONE_NAME: peekalisting.com
      NODE_ENV: production
      VITE_MODE: staging
      VITE_DEPLOY_ENV: staging
      VITE_BASE_PATH: /
      VITE_PUBLIC_APP_ORIGIN: https://staging.peekalisting.com
      VITE_PREVIEW_DEPLOYMENT: "false"
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || vars.FINDIT_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.FINDIT_SUPABASE_ANON_KEY }}
      VITE_AUTH_GOOGLE_ENABLED: ${{ vars.FINDIT_AUTH_GOOGLE_ENABLED }}
      VITE_AUTH_APPLE_ENABLED: "false"
      VITE_FEATURE_BUSINESS_PROFILES: "true"
      VITE_FEATURE_CURATED_BUSINESS_MARKETPLACE: "true"
      VITE_FEATURE_MESSAGING: "true"
      VITE_FEATURE_ESSENTIAL_NOTIFICATIONS: "true"
      VITE_FEATURE_GOOGLE_OAUTH: "true"
      VITE_FEATURE_MAPS: ${{ vars.FINDIT_MAPS_ENABLED }}
      VITE_MAPTILER_PUBLIC_KEY: ${{ secrets.FINDIT_MAPTILER_PUBLIC_KEY }}
      VITE_MAPTILER_STYLE_ID: ${{ vars.FINDIT_MAPTILER_STYLE_ID }}
      VITE_FEATURE_INTERNATIONAL_LISTING: "false"
      VITE_FEATURE_MANUAL_LOCATION: "true"
      VITE_FEATURE_CURRENT_LOCATION: "true"
      VITE_FEATURE_CURRENCY_CONVERSION: "false"
      VITE_FEATURE_PHONE_VERIFICATION: "false"
      VITE_FEATURE_SERVICE_RADIUS: "false"
      VITE_FEATURE_REPORTING: "true"
      VITE_FEATURE_PAYMENTS: "false"
      VITE_FEATURE_SUBSCRIPTIONS: "false"
      VITE_FEATURE_ESCROW: "false"
      VITE_FEATURE_PREMIUM_LISTINGS: "false"
      VITE_FEATURE_AI_MODERATION: "false"
      VITE_FEATURE_AI_BAN_EVASION: "false"
      VITE_FEATURE_AI_TICKET_TRIAGE: "false"
      VITE_FEATURE_AI_SUPPORT_CHAT: "false"
      VITE_FEATURE_SCHEDULED_REMINDERS: "false"
      VITE_FEATURE_MARKETING_EMAILS: "false"
      VITE_FEATURE_LISTING_EXPIRY: "false"
      VITE_FEATURE_LISTING_FRESHNESS_REMINDERS: "false"
      VITE_FEATURE_PREVIEW_FIXTURES: "false"
      VITE_PREVIEW_AUTH_BYPASS: "false"
      VITE_FEATURE_TOURS: "true"
      VITE_FEATURE_TOURS_PREVIEW: "false"
      TOURS_BACKEND_ENABLED: "true"

    steps:
      - name: Check out exact main head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Verify canonical source and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          case "$VITE_SUPABASE_URL" in
            *bwgklpxoetrrkutottdb*) ;;
            *) echo "::error::Canonical staging is not bound to FindIt Staging Supabase"; exit 1 ;;
          esac

      - name: Normalize lockfile
        run: node ./scripts/normalize-package-lock.mjs --write

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev --ignore-scripts

      - name: Validate staging environment
        run: npm run validate:env

      - name: Build canonical staging PWA
        run: npm run build

      - name: Stamp exact build identity
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/current-build.txt <<EOF
          product=PeekaListing
          environment=staging
          host=staging.peekalisting.com
          branch=main
          sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          backend=bwgklpxoetrrkutottdb
          EOF
          cat > dist/staging-build.json <<EOF
          {"product":"PeekaListing","environment":"staging","host":"staging.peekalisting.com","branch":"main","sha":"$GITHUB_SHA","run_id":"$GITHUB_RUN_ID","backend":"bwgklpxoetrrkutottdb"}
          EOF
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

      - name: Ensure isolated Cloudflare Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          projects="$(curl --fail-with-body --silent --show-error --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api")"
          if jq -e --arg name "$CLOUDFLARE_PAGES_PROJECT" '.result[] | select(.name == $name)' <<<"$projects" >/dev/null; then
            curl --fail-with-body --silent --show-error \
              --request PATCH \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data '{"production_branch":"main"}' \
              "$api/${CLOUDFLARE_PAGES_PROJECT}" | jq -e '.success == true' >/dev/null
          else
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$(jq -n --arg name "$CLOUDFLARE_PAGES_PROJECT" '{name:$name,production_branch:"main"}')" \
              "$api" | jq -e '.success == true' >/dev/null
          fi

      - name: Deploy exact main build to Cloudflare Pages
        run: >-
          npx --yes wrangler@4 pages deploy dist
          --project-name="$CLOUDFLARE_PAGES_PROJECT"
          --branch=main
          --commit-hash="$GITHUB_SHA"
          --commit-message="PeekaListing canonical staging $GITHUB_SHA"

      - name: Point staging.peekalisting.com at canonical Pages project
        shell: bash
        run: |
          set -euo pipefail
          account_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          zone_json="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/zones?name=${CLOUDFLARE_ZONE_NAME}&account.id=${CLOUDFLARE_ACCOUNT_ID}")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$zone_json")"
          test -n "$zone_id" || { echo '::error::Cloudflare zone peekalisting.com was not found'; exit 1; }

          pages_target="${CLOUDFLARE_PAGES_PROJECT}.pages.dev"
          records="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=${CLOUDFLARE_STAGING_DOMAIN}")"
          record_id="$(jq -r '.result[0].id // empty' <<<"$records")"
          payload="$(jq -n --arg name "$CLOUDFLARE_STAGING_DOMAIN" --arg content "$pages_target" \
            '{type:"CNAME",name:$name,content:$content,proxied:true,ttl:1}')"
          if [[ -n "$record_id" ]]; then
            curl --fail-with-body --silent --show-error --request PUT "${auth[@]}" --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}" \
              | jq -e '.success == true' >/dev/null
          else
            curl --fail-with-body --silent --show-error --request POST "${auth[@]}" --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" \
              | jq -e '.success == true' >/dev/null
          fi

          domains_api="${account_api}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/domains"
          domains="$(curl --fail-with-body --silent --show-error "${auth[@]}" "$domains_api")"
          if ! jq -e --arg name "$CLOUDFLARE_STAGING_DOMAIN" '.result[] | select(.name == $name)' <<<"$domains" >/dev/null; then
            curl --fail-with-body --silent --show-error --request POST "${auth[@]}" \
              --data "$(jq -n --arg name "$CLOUDFLARE_STAGING_DOMAIN" '{name:$name}')" \
              "$domains_api" | jq -e '.success == true' >/dev/null
          fi

      - name: Verify canonical domain serves this exact commit
        shell: bash
        run: |
          set -euo pipefail
          expected="sha=$GITHUB_SHA"
          for attempt in $(seq 1 90); do
            body="$(curl --silent --show-error --fail \
              --header 'Cache-Control: no-cache' \
              "https://${CLOUDFLARE_STAGING_DOMAIN}/current-build.txt?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if grep -Fxq "$expected" <<<"$body"; then
              echo "Canonical staging domain is serving $GITHUB_SHA"
              curl --fail --silent --show-error --header 'Cache-Control: no-cache' \
                "https://${CLOUDFLARE_STAGING_DOMAIN}/" >/dev/null
              exit 0
            fi
            echo "Waiting for canonical domain cutover (${attempt}/90)"
            sleep 5
          done
          echo "::error::staging.peekalisting.com did not serve the exact deployed commit"
          exit 1
