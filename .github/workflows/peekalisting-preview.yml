name: Deploy staging to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to publish the isolated staging build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: peekalisting-staging
      CLOUDFLARE_STAGING_DOMAIN: staging.peekalisting.com
      NODE_ENV: production
      VITE_MODE: staging
      # This is an isolated staging deployment, not a disposable preview.
      # `preview` intentionally unregisters the service worker, which makes
      # the installed PWA unusable on the staging URL.
      VITE_DEPLOY_ENV: staging
      VITE_BASE_PATH: /
      # Keep OAuth callbacks on the canonical Cloudflare staging origin even
      # when a tester opens a deployment-specific Pages URL.
      VITE_PUBLIC_APP_ORIGIN: https://staging.peekalisting.com
      FINDIT_STAGING_ORIGIN: https://staging.peekalisting.com
      FINDIT_EXPECTED_PROJECT_REF: ${{ vars.FINDIT_EXPECTED_PROJECT_REF }}
      # Prefer environment-scoped browser configuration. The fallback keeps
      # this staging-only workflow compatible with the existing public staging
      # Supabase configuration while the owner finishes environment setup.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || vars.FINDIT_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.FINDIT_SUPABASE_ANON_KEY }}
      VITE_AUTH_GOOGLE_ENABLED: "true"
      VITE_AUTH_APPLE_ENABLED: "false"
      VITE_FEATURE_BUSINESS_PROFILES: "true"
      VITE_FEATURE_MESSAGING: "true"
      VITE_FEATURE_ESSENTIAL_NOTIFICATIONS: "true"
      VITE_FEATURE_GOOGLE_OAUTH: "true"
      # Staging exercises the real MapLibre stack with the no-key OpenFreeMap
      # fallback. Production remains protected by the MapTiler key gate.
      VITE_FEATURE_MAPS: "true"
      VITE_FEATURE_CURRENT_LOCATION: "true"
      VITE_FEATURE_MANUAL_LOCATION: "true"
      VITE_FEATURE_REPORTING: "true"
      VITE_FEATURE_CURRENCY_CONVERSION: "false"
      VITE_FEATURE_PHONE_VERIFICATION: "false"
      VITE_FEATURE_INTERNATIONAL_LISTING: "false"
      VITE_FEATURE_SERVICE_RADIUS: "false"
      VITE_FEATURE_LISTING_EXPIRY: "false"
      VITE_FEATURE_LISTING_FRESHNESS_REMINDERS: "false"
      VITE_FEATURE_TOURS: "true"
      VITE_FEATURE_TOURS_PREVIEW: "false"
      VITE_FEATURE_PREVIEW_FIXTURES: "false"
      VITE_PREVIEW_AUTH_BYPASS: "false"
      VITE_FEATURE_PAYMENTS: "false"
      VITE_FEATURE_SUBSCRIPTIONS: "false"
      VITE_FEATURE_ESCROW: "false"
      VITE_FEATURE_PREMIUM_LISTINGS: "false"
      VITE_FEATURE_AI_MODERATION: "false"
      VITE_FEATURE_AI_BAN_EVASION: "false"
      VITE_FEATURE_AI_TICKET_TRIAGE: "false"
      VITE_FEATURE_AI_SUPPORT_CHAT: "false"
      VITE_FEATURE_SCHEDULED_REMINDERS: "false"
      VITE_FEATURE_MARKETING_EMAILS: "false"
      TOURS_BACKEND_ENABLED: "true"
      FINDIT_TOURS_WORKERS_ENABLED: "true"
      FINDIT_TOURS_RELEASE_ACCEPTED: "true"
      FINDIT_TOUR_PROCESSOR_MODE: "github-actions"
      FINDIT_TOUR_CLEANUP_WORKER_SECRET: ${{ secrets.FINDIT_TOUR_CLEANUP_WORKER_SECRET }}
      FINDIT_TOUR_CACHE_WORKER_SECRET: ${{ secrets.FINDIT_TOUR_CACHE_WORKER_SECRET }}
      FINDIT_TOUR_OBSERVABILITY_WORKER_SECRET: ${{ secrets.FINDIT_TOUR_OBSERVABILITY_WORKER_SECRET }}
      FINDIT_ESSENTIAL_NOTIFICATIONS_WORKERS_ENABLED: "true"
      FINDIT_NOTIFICATION_FANOUT_WORKER_SECRET: ${{ secrets.FINDIT_NOTIFICATION_FANOUT_WORKER_SECRET }}
      FINDIT_RECOMMENDATION_WORKERS_ENABLED: "true"
      FINDIT_RECOMMENDATION_WORKER_SECRET: ${{ secrets.FINDIT_RECOMMENDATION_WORKER_SECRET }}

    steps:
      - name: Check out staging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Normalize locked dependency metadata
        run: node ./scripts/normalize-package-lock.mjs --write

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev --ignore-scripts

      - name: Validate staging environment
        run: npm run validate:env

      - name: Build and verify staging artifact
        run: npm run build

      - name: Verify Cloudflare security contracts
        run: npm run verify:deployment-security

      - name: Ensure the Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          projects="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")"
          if jq -e --arg name "${CLOUDFLARE_PAGES_PROJECT}" '.result[] | select(.name == $name)' <<<"${projects}" >/dev/null; then
            production_branch="$(jq -r --arg name "${CLOUDFLARE_PAGES_PROJECT}" '.result[] | select(.name == $name) | .production_branch' <<<"${projects}")"
            if [[ "${production_branch}" != "staging" ]]; then
              curl --fail-with-body --silent --show-error \
                --request PATCH \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                --header 'Content-Type: application/json' \
                --data '{"production_branch":"staging"}' \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}" \
                | jq -e '.success == true' >/dev/null
              echo "Set ${CLOUDFLARE_PAGES_PROJECT} production branch to staging."
            else
              echo "Cloudflare Pages project ${CLOUDFLARE_PAGES_PROJECT} already exists."
            fi
          else
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$(jq -n --arg name "${CLOUDFLARE_PAGES_PROJECT}" '{name:$name,production_branch:"staging"}')" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              | jq -e '.success == true' >/dev/null
            echo "Created isolated Cloudflare Pages project ${CLOUDFLARE_PAGES_PROJECT}."
          fi

      - name: Configure isolated staging metadata bindings
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg url "${VITE_SUPABASE_URL}" \
            --arg key "${VITE_SUPABASE_ANON_KEY}" \
            '{deployment_configs:{preview:{env_vars:{SUPABASE_URL:{type:"plain_text",value:$url},SUPABASE_PUBLISHABLE_KEY:{type:"secret_text",value:$key}}},production:{env_vars:{SUPABASE_URL:{type:"plain_text",value:$url},SUPABASE_PUBLISHABLE_KEY:{type:"secret_text",value:$key}}}}}')"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}" \
            | jq -e '.success == true' >/dev/null
          echo 'Configured browser-safe Supabase bindings for the isolated staging project.'

      - name: Prepare staging Functions runtime
        run: node ./scripts/prepare-pages-functions-runtime.mjs

      - name: Deploy the isolated staging project
        run: >-
          npx wrangler pages deploy dist
          --project-name="${CLOUDFLARE_PAGES_PROJECT}"
          --branch=staging
          --commit-hash="$GITHUB_SHA"
          --commit-message="Cloudflare staging $GITHUB_SHA"

      - name: Provision the canonical staging hostname
        shell: bash
        run: |
          set -euo pipefail
          domains="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/domains")"
          if jq -e --arg name "${CLOUDFLARE_STAGING_DOMAIN}" '.result[] | select(.name == $name)' <<<"${domains}" >/dev/null; then
            echo "Pages custom domain ${CLOUDFLARE_STAGING_DOMAIN} already exists."
          else
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$(jq -n --arg name "${CLOUDFLARE_STAGING_DOMAIN}" '{name:$name}')" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/domains" \
              | jq -e '.success == true' >/dev/null
            echo "Requested Pages custom domain ${CLOUDFLARE_STAGING_DOMAIN}."
          fi

          domain_status=""
          for attempt in $(seq 1 90); do
            domain="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/domains/${CLOUDFLARE_STAGING_DOMAIN}")"
            domain_status="$(jq -r '.result.status' <<<"${domain}")"
            if [[ "${domain_status}" == "active" ]]; then
              echo "Pages custom domain ${CLOUDFLARE_STAGING_DOMAIN} is active."
              break
            fi
            if [[ "${domain_status}" =~ ^(blocked|deactivated|error)$ ]]; then
              jq -r '.result | {status, validation_data, verification_data}' <<<"${domain}"
              exit 1
            fi
            echo "Waiting for ${CLOUDFLARE_STAGING_DOMAIN} (${domain_status}, attempt ${attempt}/90)."
            sleep 5
          done
          if [[ "${domain_status}" != "active" ]]; then
            echo "Timed out waiting for ${CLOUDFLARE_STAGING_DOMAIN} to activate."
            exit 1
          fi

      - name: Verify hosted staging
        run: npm run verify:cloudflare-staging
