name: Listing Publication Journey Gates

on:
  pull_request:
    paths:
      - 'src/pages/CreateListing.jsx'
      - 'src/pages/MyListings.jsx'
      - 'src/components/create-listing/**'
      - 'src/components/listings/**'
      - 'src/services/listingCreationService.js'
      - 'src/services/ownerListingsService.js'
      - 'src/services/publicListingsService.js'
      - 'src/repositories/listingCreationRepository.js'
      - 'src/repositories/ownerListingsRepository.js'
      - 'src/repositories/publicListingsRepository.js'
      - 'supabase/migrations/0021_v1_listing_creation_and_media.sql'
      - 'supabase/tests/v1_listing_creation_and_media.sql'
      - 'scripts/phase4-listing-creation-smoke-local.mjs'
      - 'tests/listingPublicationJourneyContracts.test.mjs'
      - '.github/workflows/listing-publication-journey-gates.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - run: node --test tests/listingPublicationJourneyContracts.test.mjs
