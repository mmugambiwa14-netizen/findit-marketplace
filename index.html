<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
         values on notched and rounded displays; without it the app renders in
         the safe rectangle and standalone mode looks letterboxed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Browse local listings, view public Peeks, and request current evidence before you commit on PeekaListing." />
    <meta name="theme-color" content="#050914" />
    <meta name="application-name" content="PeekaListing" />
    <meta name="color-scheme" content="dark" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS ignores the manifest for standalone mode and window chrome, so the
         Apple-specific tags are required rather than redundant.
         `mobile-web-app-capable` is the standardised name; the `apple-` variant
         is kept for iOS versions that still only honour the original. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PeekaListing" />
    <!-- black-translucent lets content run under the status bar, which is what
         the safe-area insets above then compensate for. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./brand/peekalisting-binoculars.svg" />
    <link rel="mask-icon" href="./brand/peekalisting-binoculars.svg" color="#2563EB" />
    <link rel="icon" type="image/png" sizes="192x192" href="./brand/peekalisting-icon-192.png" />
    <link rel="apple-touch-icon" href="./brand/peekalisting-icon-192.png" />
    <title>PeekaListing Marketplace</title>
    <script type="module" src="/src/documentBootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
